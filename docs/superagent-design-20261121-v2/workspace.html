 else if(page==='work'&&work(id)){nav='projects';content=workPage(id,tab||'overview');bread=crumb('项目','projects')+crumb(project(work(id).project).name,'projects/'+work(id).project)+crumb(work(id).title)}
 else if(page==='inbox'){content=inboxPage(id);bread=crumb('待决策');nav='inbox'}

 else if(page==='sources'){content=sourcesPage(id,tab);bread=crumb('设置','settings')+crumb('任务来源',id?'sources':null)+(id?crumb(id==='new'?'添加来源':source(id)?.name||'候选条目'): '');nav='settings'}
 else if(page==='models'){content=modelsPage(id||'default');bread=crumb('设置','settings')+crumb('阶段模型');nav='settings'}
 else{content=heading('没有这个页面','可以回到工作概览继续。')+`<button class="btn" data-route="home">返回概览</button>`;bread=crumb('页面不存在')}
 view.className='view'+(page==='chat'?' chat-view':'');view.innerHTML=content;restoreDecisionDraft();$('#breadcrumbs').innerHTML=bread;

 $('#pinned-projects').innerHTML=projects.filter(p=>!p.excluded).map(p=>`<button class="pinned-project" data-route="projects/${p.id}"><i></i>${esc(p.name)}</button>`).join('');
 if(page==='chat'){$('#draft').value=chat.text;$('#thread').scrollTop=chat.threadScroll??$('#thread').scrollHeight}

 view.scrollTop=navScroll.get(current)||0;if(previous!==current){const h=$('h1',view);h?.focus({preventScroll:true})}

function projectPreview(p){const ws=projectWorks(p.id),count=openDecisions().filter(d=>work(d.work).project===p.id).length;return `<button class="project-preview" data-route="projects/${p.id}"><div class="row"><span class="project-mark ${p.color}">${p.short}</span><div><h3>${esc(p.name)}</h3><p class="project-purpose">${esc(p.purpose)}</p></div></div><p class="project-state">${count?count+' 项等你决定':ws.some(w=>w.active)?'工作正在推进':'当前无需处理'}</p><footer><span>${ws.length} 件事 · ${ws.length} 个会话</span><span>进入 →</span></footer></button>`}
function homePage(){const ds=openDecisions(),first=ds[0],w=first&&work(first.work);return `<div class="content">${heading('工作，有条不紊。','先看需要你拍板的事，其他工作各自推进。','YOUR WORKSPACE',`<span class="tag">合成项目 · 未连接</span>`)}<div class="overview-grid"><section class="next-action"><div class="row between"><span class="tag ${first?'amber':'green'}">${first?'需要你决定':'没有待决策项'}</span><span class="tiny muted">${ds.length?`1 / ${ds.length}`:'当前演示范围'}</span></div><h2>${first?esc(first.title):'可以专注做别的事。'}</h2><p>${first?esc(first.summary):'项目里的工作和结果仍可按需查看。没有把空闲状态当作完成。'}</p><div class="row"><span class="project-label">${w?`${esc(project(w.project).name)} / ${esc(w.title)}`:'仅统计受管项目'}</span><span class="spacer"></span><button class="btn ${first?'primary':''}" data-route="${first?'inbox/'+first.id:'projects'}">${first?'去做决定':'查看项目'} →</button></div></section><section class="brief-card"><span class="mini-emblem">${icon('chat')}</span><div><h3>有新要求？直接说。</h3><p>超管自动找相关项目与会话。截图也可以一起交代。</p></div><button class="btn" data-route="chat">与超管沟通 ${icon('arrow')}</button></section></div><section class="home-bottom"><div class="section-head"><h3>项目</h3><button class="text-link" data-route="projects">查看全部 →</button></div><div class="project-preview-grid">${projects.filter(p=>!p.excluded).slice(0,3).map(projectPreview).join('')}</div></section>${managed(work('report'))?'<div class="home-activity"><span style="color:#94b29f">✓</span><span>BlogDeck · 系列顺序已检查，未发布文章。</span><button class="text-link" data-route="work/report/result">看结果 →</button></div>':''}</div>`}
function projectsPage(){return `<div class="content">${heading('项目','从项目进入事项，再看相关会话和来源。不把所有工作平铺在一起。','PROJECTS')}<div class="project-collection">${projects.filter(p=>!p.excluded).map(p=>{const ws=projectWorks(p.id),count=openDecisions().filter(d=>work(d.work).project===p.id).length;return `<article class="panel project-card"><div class="row between"><span class="project-mark ${p.color}">${p.short}</span>${count?`<span class="tag amber">${count} 项待决策</span>`:'<span class="tag green">无需处理</span>'}</div><h2>${esc(p.name)}</h2><p>${esc(p.purpose)}</p><div class="counts"><span><strong>${ws.length}</strong>事项</span><span><strong>${ws.length}</strong>会话</span></div><button class="btn" data-route="projects/${p.id}">进入项目 →</button></article>`}).join('')}</div><p class="hint">新项目默认纳入。排除与恢复在 <button class="text-link" data-route="scope">管理范围</button> 中处理。</p></div>`}
function projectTabs(id,selected){return `<nav class="tabs" aria-label="项目视图">${[['work','事项'],['sessions','关联会话'],['sources','任务来源']].map(([key,label])=>`<button class="tab ${key===selected?'active':''}" data-route="projects/${id}/${key}" ${key===selected?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`}
function workRow(w){return `<button class="work-row" data-route="work/${w.id}"><span class="work-dot ${w.state==='waiting'?'amber':w.state==='ended'?'green':''}"></span><div><h3>${esc(w.title)}</h3><p>${esc(w.summary)}</p></div><span class="row-state">${esc(w.stage)}</span><span class="row-time">${esc(w.time)} · 示例</span><span class="muted">→</span></button>`}
function projectPage(id,selected){const p=project(id),ws=projectWorks(id);if(p.excluded)return `<div class="content">${heading(p.name,'项目已排除，不再展示工作正文。')}<button class="btn" data-route="scope/${id}">查看管理范围</button></div>`;let body='';if(selected==='sessions'){body=`<div class="panel">${ws.map(w=>`<div class="setting-list-row"><span class="project-mark">会</span><div><h3>${esc(w.title)} · 原会话</h3><p>负责事项：${esc(w.title)} · ${w.active?'有工作在途':'当前未执行'}</p></div><span class="spacer"></span><button class="btn" data-session-info="${w.id}">会话详情</button></div>`).join('')}</div>`}else if(selected==='sources'){body=`<div class="panel">${sources.filter(s=>s.project===id).map(s=>`<button class="setting-list-row" data-route="sources/${s.id}">${icon('source')}<div><h3>${esc(s.name)}</h3><p>${esc(s.kind)} · ${s.enabled?'已启用':'已暂停'}</p></div><span class="arrow">→</span></button>`).join('')||'<div class="empty">这个项目暂无配置的文档来源。</div>'}</div>`}else{body=`<div class="panel work-list">${ws.map(workRow).join('')||'<div class="empty">当前没有受管事项。</div>'}</div>`}return `<div class="content">${heading(p.name,p.purpose,'PROJECT',`<button class="btn" data-chat-project="${id}">给项目提要求</button>`)}${projectTabs(id,selected)}${body}<p class="project-context">${ws.length} 件事项归属于此项目。会话负责处理事项，来源提供材料；它们不是三套重复任务。</p></div>`}
function workPage(id,selected){const w=work(id);if(!managed(w))return `<div class="content">${heading('此事项已排除','不再读取或展示工作正文。')}<button class="btn" data-route="scope/${w.project}">查看管理范围</button></div>`;const d=decisions.find(d=>d.id===w.decision&&!d.resolved);const tabs=[['overview','概览'],['progress','进展'],['relations','关联'],...(w.state==='ended'?[['result','结果']]:[])];if(!tabs.some(([key])=>key===selected))selected='overview';let body='';if(selected==='progress'){body=`<section class="panel timeline">${w.events.map(([time,title,text])=>`<div class="timeline-item"><time>${time} · 示例</time><div><strong>${esc(title)}</strong><p>${esc(text)}</p></div></div>`).join('')}</section><p class="hint">依据更新时间与同步时间分开。这里是合成记录，不代表当前项目实际进展。</p>`}else if(selected==='relations'){const src=source(w.source);body=`<div class="panel"><div class="panel-title"><h3>这件事由谁处理、从哪里来</h3></div><div class="setting-list-row"><span class="project-mark">项</span><div><h3>所属项目 · ${esc(project(w.project).name)}</h3><p>稳定项目关系，不按标题或工作目录猜归属。</p></div><span class="spacer"></span><button class="btn" data-route="projects/${w.project}">进入项目</button></div><div class="setting-list-row"><span class="project-mark">会</span><div><h3>处理会话 · ${esc(w.title)}</h3><p>继续已有上下文，不复制成另一份工作。</p></div><span class="spacer"></span><button class="btn" data-session-info="${w.id}">会话详情</button></div><div class="setting-list-row"><span class="project-mark">源</span><div><h3>${src?'任务来源 · '+esc(src.name):'来源 · 直接对话'}</h3><p>${src?esc(src.kind):'由用户直接提出要求，不来自文档扫描。'}</p></div><span class="spacer"></span>${src?`<button class="btn" data-route="sources/${src.id}">核对出处</button>`:''}</div></div>`}else if(selected==='result'){body=`<section class="panel summary-block"><h3>已验证</h3><p class="lead">系列序号与缺号已经检查。</p><div class="next">未执行：发布文章、创建发布排期。结果只覆盖本次检查，不代表其他工作已完成。</div></section>`}else{body=`<div class="work-structure"><section class="panel summary-block"><h3>当前进展</h3><p class="lead">${esc(w.summary)}</p><div class="next"><strong>下一步</strong><br>${esc(w.next)}</div></section><aside class="panel relation-card"><div class="relation-title">所属关系</div><div class="relation-node"><span class="dot"></span><button data-route="projects/${w.project}">${esc(project(w.project).name)}</button></div><div class="relation-connector"></div><div class="relation-node current"><span class="dot"></span>${esc(w.title)}</div><div class="relation-connector"></div><div class="relation-node"><span class="dot"></span><button data-route="work/${w.id}/relations">1 个处理会话 · 查看关联</button></div></aside></div><section class="panel summary-block" style="margin-top:18px"><h3>要完成什么</h3><p style="font-size:12px;color:#8c9bb0">${esc(w.goal)}</p></section>`}return `<div class="content">${heading(w.title,`${project(w.project).name} · ${w.time}有进展（合成时间）`,'WORK',`<button class="btn primary" data-target="${w.id}">补充要求</button>`)}<nav class="tabs" aria-label="事项视图">${tabs.map(([key,label])=>`<button class="tab ${key===selected?'active':''}" data-route="work/${id}/${key}" ${key===selected?'aria-current="page"':''}>${label}</button>`).join('')}</nav>${body}${d?`<aside class="decision-callout"><span class="tag amber">待你决定</span><div><h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p></div><button class="btn" data-route="inbox/${d.id}">去处理 →</button></aside>`:''}</div>`}
function inboxPage(id){const ds=openDecisions(),d=ds.find(d=>d.id===id),selected=id?d:(!window.matchMedia('(max-width:620px)').matches?ds[0]:null);let detail='';if(selected){const w=work(selected.work);detail=`<section class="panel decision-detail"><button class="btn quiet inbox-back" data-route="inbox">← 返回待决策</button><div class="decision-origin"><button data-route="projects/${w.project}">${esc(project(w.project).name)}</button><span>/</span><button data-route="work/${w.id}">${esc(w.title)} →</button></div><span class="tag amber">${selected.kind==='question'?'范围选择 · 不是操作批准':'特定操作审批 · 尚未执行'}</span><h2>${esc(selected.title)}</h2>${selected.kind==='question'?`<p class="explanation">幂等修复正在验证中。历史重复记录是否清理，是独立的范围决定；选择纳入也不会直接修改数据。</p><fieldset style="border:0;padding:0;margin:20px 0 0"><legend class="sr-only">修复范围</legend><label class="choice"><input type="radio" name="scope-answer" value="future"><span><strong>先只修今后的回调</strong><small>不动历史记录，先完成现有回归验证。</small></span></label><label class="choice"><input type="radio" name="scope-answer" value="history"><span><strong>历史记录也纳入方案</strong><small>先分析并制定修复计划，再单独审阅数据修改。</small></span></label><label class="choice"><input type="radio" name="scope-answer" value="custom" aria-controls="scope-input-panel"><span><strong>自行说明 / 另一种方案</strong><small>选中后填写自己的方案，不采用上面的建议。</small></span></label></fieldset><button class="text-link" id="scope-note-toggle" aria-expanded="false" aria-controls="scope-input-panel" style="margin-top:14px" hidden>＋ 补充条件（选填）</button><div id="scope-input-panel" hidden><label class="label" id="scope-input-label" for="scope-custom">你的方案（必填）</label><textarea class="field" id="scope-custom" maxlength="4000" aria-describedby="scope-input-help" disabled></textarea><p class="hint" id="scope-input-help"></p></div><div class="editor-footer"><button class="btn primary" id="answer-scope" disabled>反馈给原会话（演示）</button><span class="tiny muted" id="scope-submit-help" role="status">请先选择一种处理方式。</span></div><div id="decision-feedback" role="status"></div>`:`<p class="explanation">为告警补一组测试。请审阅完整范围；此稿没有可执行的批准按钮。</p><dl class="approval-fields"><dt>具体动作</dt><dd>新增或修改测试用例（合成）</dd><dt>允许范围</dt><dd>项目内 tests/alerts.test.ts（示例相对路径）</dd><dt>禁止范围</dt><dd>生产配置、凭据、其他文件及项目外路径</dd><dt>影响</dt><dd>不部署、不访问服务器，只修改测试内容</dd><dt>版本与期限</dt><dd>合成版本，不是有效批准；实际操作须绑定当前指纹与有效期</dd></dl><label class="label" for="approval-reason">决定理由</label><textarea class="field" id="approval-reason" placeholder="填写理由，体验回执位置。"></textarea><div class="editor-footer"><button class="btn" id="approval-preview">演示审批回执</button></div><div id="decision-feedback" role="status"></div>`}</section>`}else{const known=decisions.find(d=>d.id===id);detail=`<section class="panel decision-detail"><button class="btn quiet inbox-back" data-route="inbox">← 返回待决策</button><h2>${known?.resolved?'这项范围决定已反馈。':id?'这项决定当前不可处理。':'没有需要你处理的决定。'}</h2><p class="hint">${known?.resolved?'本地演示已将答复关联原事项，没有真实投递或执行批准。':id?'事项已排除或引用无效，没有擅自展示另一项决定。':'仅统计当前受管的合成范围，不把排除项计入。'}</p>${known?.answer&&managed(work(known.work))?`<div class="notice" style="margin-top:17px;white-space:pre-wrap"><strong>你的答复</strong><br>${esc(known.answer.text)}</div>`:''}${known&&managed(work(known.work))?`<button class="text-link" style="margin-top:17px" data-route="work/${known.work}">回到对应事项 →</button>`:''}</section>`;}return `<div class="content">${heading('待决策',`${ds.length} 项需要你。每个决定都关联具体项目和事项，不在聊天里猜“同意”指哪一个。`,'DECISIONS')}<div class="inbox-layout ${id?'selected':''}"><div class="inbox-list">${ds.map(item=>`<button class="inbox-item ${selected?.id===item.id?'active':''}" data-route="inbox/${item.id}" ${selected?.id===item.id?'aria-current="true"':''}><span class="tag ${item.kind==='question'?'amber':'blue'}">${item.kind==='question'?'范围选择':'操作审批'}</span><h3>${esc(item.title)}</h3><p>${esc(project(work(item.work).project).name)} / ${esc(work(item.work).title)}</p></button>`).join('')||'<div class="empty">暂时没有待决策。</div>'}</div>${detail}</div></div>`}
function chatPage(){return `<div class="chat-shell"><header class="chat-head"><div><h1 tabindex="-1">与超管沟通</h1><p>一句话交代工作，系统找对项目与会话。</p></div><span class="tag">本地演示 · 无真实投递</span></header><div class="thread" id="thread" role="log" aria-label="对话记录">${chat.messages.map(messageHtml).join('')}${chat.messages.length<3?`<div class="chat-example"><button data-example="继续处理支付回调，不要新建任务。">试：继续已有工作</button><button data-example="继续处理一下。">试：需要问清楚</button></div>`:''}</div><section class="composer"><div class="target-line">处理对象：<strong>${chat.target?esc(project(work(chat.target).project).name+' / '+work(chat.target).title):'自动寻找相关项目与会话'}</strong>${chat.target?'<button class="text-link" data-clear-target>恢复自动</button>':''}${chat.origin?`<span class="relation-chip">来源：${esc(source(chat.origin)?.name||'来源')}</span><button class="text-link" data-clear-origin>移除来源</button>`:''}</div><div class="input-box" id="drop-zone"><label class="sr-only" for="draft">给超管的要求</label><textarea id="draft" placeholder="例如：继续处理支付回调，这是最新截图。"></textarea><div class="attachments" id="attachments">${chat.files.map((file,i)=>`<div class="attachment"><button class="image-preview" data-image="${file.id}" aria-label="查看原图 ${esc(file.name)}"><img src="${esc(file.url)}" alt="${esc(file.name)}"></button><button class="remove" data-remove-image="${i}" aria-label="移除图片 ${esc(file.name)}">×</button></div>`).join('')}</div><div class="input-tools"><button class="btn quiet" id="pick-image">＋ 图片</button><input type="file" id="image-input" accept="image/png,image/jpeg,image/webp" multiple hidden><span class="tiny">粘贴或拖入 · 4 张以内 · 单张 5MB</span><span class="spacer"></span><button class="btn primary" id="send">发送（演示） ↑</button></div></div><p class="composer-hint" id="chat-notice" role="status">${esc(chat.notice||'目标不明确先问清楚。图片仅本地预览，不上传或识别；刷新清空。')}</p></section></div>`}
function messageHtml(m){return `<article class="message ${m.role==='你'?'user':''}"><span class="avatar">${m.role==='你'?'我':'超'}</span><div class="message-body"><div class="message-label">${esc(m.role)} · 合成演示</div><p>${esc(m.text)}</p>${m.files?.length?`<div class="message-images">${m.files.map(f=>`<button class="image-preview" data-image="${f.id}" aria-label="查看原图 ${esc(f.name)}"><img src="${esc(f.url)}" alt="${esc(f.name)}"></button>`).join('')}</div>`:''}${m.work?`<div class="receipt">${esc(project(work(m.work).project).name)} / ${esc(work(m.work).title)}<br><button class="text-link" data-route="work/${m.work}">查看这件事 →</button></div>`:''}</div></article>`}
function settingsPage(){return `<div class="content">${heading('设置','配置只在这里处理，不和日常工作混排。','SETTINGS')}<div class="settings-grid">${[['scope','folder','管理范围','新项目与会话默认纳入；按项目或会话排除与恢复。','2 级管理规则'],['sources','source','任务来源','腾讯文档、本地文档。先看来源，再审阅具体候选。','配置位置与提取规则'],['models','model','阶段模型','一个默认模型，各阶段按需覆盖，保留原会话模型。','6 个职责阶段']].map(([route,i,title,desc,note])=>`<button class="setting-tile" data-route="${route}">${icon(i)}<div><h2>${title}</h2><p>${desc}</p></div><footer>${note} →</footer></button>`).join('')}</div></div>`}
function scopePage(id){const p=project(id);if(!p)return `<div class="content">${heading('管理范围','默认纳入新项目与会话。进入一个项目，再管理其中的会话。','SETTINGS / SCOPE',`<button class="btn" id="simulate-new">模拟发现新项目</button>`)}<div class="panel setting-list">${projects.map(p=>`<button class="setting-list-row" data-route="scope/${p.id}"><span class="project-mark ${p.color}">${p.short}</span><div><h3>${esc(p.name)}</h3><p>${works.filter(w=>w.project===p.id).length} 个会话 · ${p.excluded?'现有与后续会话均受排除规则覆盖':'新增会话默认纳入'}</p></div><span class="spacer"></span><span class="tag ${p.excluded?'':'green'}">${p.excluded?'已排除':'已纳入'}</span><span class="arrow">→</span></button>`).join('')}</div><p class="hint">排除不等于停止。新发现也不会自动启动任务。</p></div>`;return `<div class="content">${heading(p.name,'项目规则覆盖当前与后续会话，单会话排除在恢复项目后仍保留。','MANAGEMENT SCOPE',`<button class="btn" data-toggle-project="${p.id}">${p.excluded?'恢复项目':'排除整个项目'}</button>`)}<div class="panel setting-detail"><div class="row between"><h3>项目中的会话</h3><span class="tag ${p.excluded?'':'green'}">${p.excluded?'项目已排除':'项目已纳入'}</span></div><div style="margin-top:14px">${works.filter(w=>w.project===p.id).map(w=>`<div class="scope-session"><div><h3>${esc(w.title)}</h3><p>${p.excluded?'受项目排除规则覆盖':w.excluded?'此会话单独排除':w.active?'有合成工作在途':'没有合成工作在途'}</p></div><button class="btn" data-toggle-work="${w.id}" ${p.excluded?'disabled':''}>${w.excluded?'恢复会话':'排除会话'}</button></div>`).join('')}</div></div><p class="hint">已受理工作不因排除而静默停止。后续读、路由与投递停止；停止工作需独立确认。</p></div>`}
function sourcesPage(id,sub){if(id==='new')return sourceNewPage();const s=source(id);if(!s)return `<div class="content">${heading('任务来源','先选择来源，再查看配置或候选条目。材料不等于执行授权。','SETTINGS / SOURCES',`<button class="btn primary" data-route="sources/new">＋ 添加来源</button>`)}<div class="panel setting-list">${sources.map(s=>`<button class="setting-list-row" data-route="sources/${s.id}">${icon('source')}<div><h3>${esc(s.name)}</h3><p>${esc(s.kind)} · ${esc(project(s.project).name)}</p></div><span class="spacer"></span><span class="tag ${s.enabled?'green':''}">${s.enabled?'启用中':'已暂停'}</span><span class="arrow">→</span></button>`).join('')}</div><p class="hint">通用腾讯文档接入能力待验证，不以现有企微表格连接器冒充支持。</p></div>`;if(sub==='candidate')return candidatePage(s);return `<div class="content">${heading(s.name,s.kind,'SOURCE',`<button class="btn" data-toggle-source="${s.id}">${s.enabled?'暂停读取':'恢复读取'}</button>`)}<section class="panel setting-detail"><span class="tag ${s.enabled?'green':''}">${s.enabled?'已启用 · 合成配置':'已暂停 · 合成配置'}</span><dl class="source-summary"><dt>所属项目</dt><dd><button class="text-link" data-route="projects/${s.project}">${esc(project(s.project).name)} →</button></dd><dt>读取位置</dt><dd>${esc(s.location)}</dd><dt>提取规则</dt><dd>${esc(s.rule)}</dd><dt>发现后</dt><dd>预览候选，生成待审阅计划；不自动执行</dd></dl><div class="editor-footer"><button class="btn primary" data-route="sources/${s.id}/candidate" ${s.enabled&&!project(s.project).excluded?'':'disabled'}>预览候选条目 →</button><span class="tiny muted">不请求真实文档</span></div></section></div>`}
function candidatePage(s){if(!s.enabled||project(s.project).excluded)return `<div class="content">${heading('候选内容当前不可读取',s.enabled?'所属项目已排除，不再展示工作正文。':'来源已暂停，先恢复读取再核对材料。')}<button class="btn" data-route="sources/${s.id}">返回来源</button></div>`;return `<div class="content">${heading('登录超时提示不清楚',s.name+' / 示例条目 12','SOURCE CANDIDATE',`<button class="btn" data-route="sources/${s.id}">返回来源</button>`)}<section class="panel setting-detail"><div class="steps"><strong>核对材料</strong><i></i><span>带入要求</span><i></i><span>审阅计划</span></div><h3>条目原文</h3><p style="font-size:14px;color:#8293ac;margin-top:12px">登录超时时提示不清楚，请补充重试说明。</p><dl class="source-summary"><dt>项目</dt><dd>${esc(project(s.project).name)}</dd><dt>出处</dt><dd>${esc(s.name)} / 合成条目 12</dd><dt>图片</dt><dd>此合成条目没有图片。真实条目有图必须查看原图，不能把占位当已看图。</dd><dt>已有处理</dt><dd>尚未关联；相同条目重读不得重复建单。</dd></dl><div class="editor-footer"><button class="btn primary" data-import-source="${s.id}" ${s.enabled&&!project(s.project).excluded?'':'disabled'}>带出处交给超管 →</button></div><p class="hint">来源内容不是授权。目标与范围明确后才生成待审阅计划。</p></section></div>`}
function sourceNewPage(){return `<div class="content">${heading('添加来源','这一步只配置一个来源，不把所有类型的说明同时展开。','NEW SOURCE')}<section class="panel setting-detail"><div class="steps"><strong>来源信息</strong><i></i><span>预览与验证</span></div><label class="label" for="source-kind">来源类型</label><select class="field" id="source-kind"><option>腾讯文档 · 在线表格</option><option>腾讯文档 · 普通文档（适配待验证）</option><option>本地文档 · Markdown</option><option>本地文档 · 目录</option></select><label class="label" for="source-name">名称</label><input class="field" id="source-name" placeholder="如：项目待办"><label class="label" for="source-location">位置</label><input class="field" id="source-location" placeholder="文档链接或经授权本地位置（演示不读取）"><label class="label" for="source-rule">提取规则</label><input class="field" id="source-rule" value="只提取未完成且属于本项目的条目"><label class="label" for="source-project">所属项目</label><select class="field" id="source-project">${projects.map(p=>`<option value="${p.id}">${esc(p.name)}${p.excluded?'（已排除）':''}</option>`).join('')}</select><div class="editor-footer"><button class="btn primary" id="save-source">添加到本页演示</button><button class="btn quiet" data-route="sources">取消并保留表单</button></div><p id="source-feedback" role="status" class="hint"></p></section></div>`}
function captureSourceDraft(){if($('#source-name'))sourceDraft={kind:$('#source-kind').value,name:$('#source-name').value,location:$('#source-location').value,rule:$('#source-rule').value,project:$('#source-project').value}}
function restoreSourceDraft(){if(sourceDraft)for(const key of ['kind','name','location','rule','project'])$('#source-'+key).value=sourceDraft[key]}
function modelsPage(id){const stage=stages.find(s=>s[0]===id),value=models[id]||'balanced';return `<div class="content">${heading('阶段模型','先选阶段，再配置该阶段。不是每条要求串行跑六次模型。','SETTINGS / MODELS')}<div class="model-index"><nav class="model-nav" aria-label="模型阶段">${[['default','默认模型','其他阶段可沿用'],...stages.map(([id,name,desc])=>[id,name,desc])].map(([key,name,desc])=>`<button class="model-stage ${key===id?'active':''}" data-route="models/${key}" ${key===id?'aria-current="page"':''}>${name}<small>${desc}</small></button>`).join('')}</nav><section class="panel setting-detail"><div class="eyebrow">${id==='default'?'DEFAULT MODEL':'STAGE OVERRIDE'}</div><h2 style="font-size:20px;margin:8px 0">${esc(stage?.[1]||'默认模型')}</h2><p class="setting-header-note">${esc(stage?.[2]||'未覆盖阶段使用此模型，不改变全局默认或已有会话模型。')}</p><label class="label" for="stage-model">${id==='default'?'默认模型':'此阶段使用'}</label><select class="field" id="stage-model">${Object.entries(modelNames).filter(([key])=>id!=='default'||key!=='inherit').map(([key,name])=>`<option value="${key}">${name}</option>`).join('')}</select><p class="hint">当前已保存：${esc(modelNames[value])}${value==='inherit'?' → '+esc(modelNames[models.default]):''}</p>${id==='execute'?'<div class="notice" style="margin-top:16px">已有会话默认保留其原模型。这里的覆盖面向新子任务或执行协调器，不悄悄更改已存在的会话。</div>':''}${id==='understand'?'<p class="hint">必须具备原图能力，不支持时阻断，不丢图继续。</p>':''}<div class="editor-footer"><button class="btn primary" id="save-model">校验并保存演示配置</button></div><div id="model-feedback" role="status"></div><p class="hint">模型仅为能力示例，不是已安装清单。不静默换 provider；实际能力与数据外发须由 Host 校验。</p></section></div></div>`}
function openDialog(title,html,label='本地演示'){if(!$('#dialog').open)opener=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-label').textContent=label;$('#dialog-body').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal()}
function closeDialog(){if($('#dialog').open)$('#dialog').close();pendingRoute=null;if(opener?.isConnected)opener.focus()}
function closeMenu(){$('#sidebar').classList.remove('open');$('#nav-backdrop').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false')}
function notice(text){chat.notice=text;const node=$('#chat-notice');if(node)node.textContent=text}
function setTarget(id){const w=work(id);if(!managed(w))return;if(chat.target!==id&&(chat.text.trim()||chat.files.length||chat.origin)){openDialog('先确认当前草稿的归属',`<p>当前草稿属于另一件事。不会把旧文字或截图默默转交给新会话。</p><div class="dialog-actions"><button class="btn" data-route="chat" data-close>回到原草稿</button></div>`);return}chat.target=id;navigate('chat')}
function sessionInfo(id){const w=work(id);if(!managed(w))return;openDialog('处理会话：'+w.title,`<span class="relation-chip">${esc(project(w.project).name)} / ${esc(w.title)}</span><h3>会话负责什么</h3><p>${esc(w.goal)}</p><h3>当前工作</h3><p>${esc(w.summary)}</p><h3>执行模型</h3><p>原会话模型（示例）。定位阶段的模型不会覆盖它。</p><div class="dialog-actions"><button class="btn primary" data-target="${w.id}" data-close>补充给此会话</button><button class="btn" data-stop="${w.id}">停止工作…</button></div><p class="hint">此处演示已有普通会话可受控，不操作真实会话。</p>`)}
function askExclude(kind,id){const item=kind==='project'?project(id):work(id);if(!item)return;if(item.excluded){item.excluded=false;revision++;render();return}const active=kind==='project'?works.some(w=>w.project===id&&w.active):item.active;openDialog('排除'+(kind==='project'?'项目':'会话'),`<div class="notice amber">排除后停止后续读取、自动路由与派发；不会删除或默默停止已经受理的工作。</div><h3>${esc(kind==='project'?item.name:item.title)}</h3><p>${active?'这里有合成工作在途，排除不会使其终止。后续应到原会话处理，停止另行确认。':'这里没有合成工作在途。'}</p><p class="hint">项目排除覆盖后续新会话。恢复项目不会抹去原有的单会话排除。</p><div class="dialog-actions"><button class="btn primary" data-confirm-exclude="${kind}:${id}">确认排除（演示）</button><button class="btn" data-close>取消</button></div>`)}
function isNewDemoIntent(text){return text.split(/[，。；,;\n]/).some(clause=>/新建|新任务|新增|增加.*任务|生成.*计划|待审阅计划/.test(clause)&&!/(不要|不再|别|无需|不用|不是|并非|不需要).*(新建|新任务|新增|增加|生成|待审阅计划)/.test(clause))}
function planPreview(text,projectId){openDialog('先明确新工作的范围',`<div class="notice">新需求不追加给关键词相似的旧任务；这里仅展示计划入口，不创建或执行。</div><h3>本次要求</h3><p>${esc(text)}</p><h3>所属项目</h3><p>${projectId?esc(project(projectId).name):'需要进一步确认，不猜项目归属。'}</p><h3>后续路径</h3><p>确认目标、范围和验收 → 生成具体版本计划 → 审阅计划 → 才能派发。</p><p class="hint">原草稿与 ${chat.files.length} 张图片仍保留，没有发送或丢弃。</p>`)}
function sendChat(){capture();const text=chat.text.trim();if(!text&&!chat.files.length){notice('请先输入要求或添加图片。');return}const explicit=projects.filter(p=>text.toLowerCase().includes(p.name.toLowerCase()));if(explicit.some(p=>p.excluded)){notice('要求指定了已排除项目，没有投递。');return}const selected=chat.target&&work(chat.target);if(selected&&(!managed(selected)||(explicit.length&&(!explicit.some(p=>p.id===selected.project)||explicit.length>1)))){notice('文字中的项目与定向目标冲突，或目标已排除。没有投递，请恢复自动或重新明确。');return}if(chat.origin&&(!source(chat.origin)?.enabled||project(source(chat.origin).project).excluded)){notice('来源已暂停或项目已排除。请重新核对出处。');return}if(isNewDemoIntent(text)){planPreview(text,explicit.length===1?explicit[0].id:null);return}let candidates=works.filter(managed).filter(w=>w.state!=='ended');if(explicit.length===1)candidates=candidates.filter(w=>w.project===explicit[0].id);let picked=selected;if(!picked&&explicit.length<=1){const keys=[text.includes('支付')?'payment':null,text.includes('界面')||text.includes('截图')?'ui':null,text.includes('告警')?'alarm':null].filter(Boolean);if(keys.length===1)picked=candidates.find(w=>w.id===keys[0])}pendingRoute={text,files:[...chat.files],revision};if(picked){deliver(picked);return}if(!candidates.length){notice('没有符合要求的受管会话。可恢复管理范围，或明确提出新建计划。');pendingRoute=null;return}openDialog('这次交给哪一件事？',`<p>目标未能唯一确定。选择具体事项，不预选、不盲投。</p>${candidates.map(w=>`<label class="choice"><input type="radio" name="route-choice" value="${w.id}"><span><strong>${esc(w.title)}</strong><small>${esc(project(w.project).name)} · ${esc(w.stage)}</small></span></label>`).join('')}<div class="dialog-actions"><button class="btn primary" id="confirm-route">交给所选会话（演示）</button><button class="btn" data-close>取消，保留草稿</button></div><p class="hint">没有适合的目标就取消。正式产品根据可信关系与工作证据检索，不靠此演示的关键词规则。</p>`)}
function deliver(w){if(!pendingRoute||!managed(w)||pendingRoute.revision!==revision){notice('管理范围已变化，没有投递，请重新确认。');pendingRoute=null;return}chat.messages.push({role:'你',text:pendingRoute.text||'请查看这些图片。',files:pendingRoute.files},{role:'超管',text:'已匹配原会话；这是本地投递回执演示，未发送给真实会话。',work:w.id,files:[]});chat.text='';chat.files=[];chat.origin=null;chat.threadScroll=null;pendingRoute=null;notice('演示结束。实际产品须持久受理并核查回执，不能把匹配目标当执行成功。');closeDialog();render()}
function addImages(files){capture();const errors=[];for(const f of files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)){errors.push('仅演示 PNG/JPEG/WebP 图片');continue}if(f.size>5*1024*1024){errors.push(f.name+' 超过单张 5MB');continue}if(chat.files.length>=4){errors.push('演示最多 4 张图片');break}const id='file-'+(++fileCounter),url=URL.createObjectURL(f),file={id,url,name:f.name};urls.set(id,file);chat.files.push(file)}notice(errors.join('；')||'图片仅保留在当前页，不上传或识别。可点击放大核对。');render()}
function openImage(id){const file=urls.get(id);if(!file)return;openDialog('原图预览',`<img class="image-full" src="${esc(file.url)}" alt="${esc(file.name)}"><div class="image-name">${esc(file.name)} · 本地预览，不上传</div>`)}
function importSource(id){capture();const s=source(id);if(!s?.enabled||project(s.project).excluded)return;if(chat.text.trim()||chat.files.length||chat.origin){openDialog('保留原草稿，暂不导入',`<p>已有未发送文字、图片或来源。不会覆盖原稿，也不会把旧截图夹带到新工作。</p><div class="dialog-actions"><button class="btn" data-route="chat" data-close>回到原草稿</button></div>`);return}chat.origin=id;chat.target=null;chat.text=`请为 ${project(s.project).name} 的来源“${s.name}”示例条目12生成待审阅计划：登录超时提示不清楚，请补充重试说明。尚未授权执行。`;notice('合成出处已关联草稿，没有读取真实来源或创建任务。');navigate('chat')}
function saveModel(){const id=current.split('/')[1]||'default',value=$('#stage-model').value,candidate={...models,[id]:value},understand=candidate.understand==='inherit'?candidate.default:candidate.understand;if(!['vision','balanced'].includes(understand)){$('#model-feedback').innerHTML='<p class="local-feedback" style="color:#91611b;background:#fff8ed">未保存：图片理解阶段没有图像能力。不会丢图继续或静默换模型。</p>';return}models[id]=value;delete modelDrafts[id];render();$('#model-feedback').innerHTML='<p class="local-feedback">已存入本页内存，刷新清空。后续调用才生效，不改全局默认或已有会话模型。</p>'}
function about(){openDialog('这是一份分层交互稿',`<p>工作概览只显示下一步和项目摘要。项目 → 事项 → 关联会话/来源，用面包屑与返回路径连接。待决策是独立收件箱，超管对话随时可达。</p><h3>离线边界</h3><p>全部为合成数据。不联网、不执行、不审批；图片只在本地预览，设置刷新清空。</p><h3>验证范围</h3><p>本稿可做源码和语法检查，尚未用真实浏览器验图；不是当前运行插件的界面或控制能力证明。</p>`)}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-close'))closeDialog();
 if(b.dataset.route){navigate(b.dataset.route);return}
 if(b.dataset.target){setTarget(b.dataset.target);return}
 if(b.dataset.sessionInfo){sessionInfo(b.dataset.sessionInfo);return}
 if(b.dataset.chatProject){capture();const p=project(b.dataset.chatProject);if(chat.text.trim()||chat.files.length||chat.origin){navigate('chat');notice('已有草稿已保留。需要时请在要求中明确项目。')}else{chat.target=null;chat.text=`关于 ${p.name}：`;navigate('chat')}return}
 if(b.dataset.toggleProject){askExclude('project',b.dataset.toggleProject);return}
 if(b.dataset.toggleWork){askExclude('work',b.dataset.toggleWork);return}
 if(b.dataset.confirmExclude){const [kind,id]=b.dataset.confirmExclude.split(':');const item=kind==='project'?project(id):work(id);item.excluded=true;revision++;if(chat.target&&!managed(work(chat.target)))notice('原目标已排除。草稿与图片保留，不自动改投其他事项；请显式恢复或重新指定。');closeDialog();render();return}
 if(b.dataset.stop){const w=work(b.dataset.stop);openDialog('停止工作需要独立确认',`<p>对象：${esc(project(w.project).name)} / ${esc(w.title)}</p><label class="label" for="stop-reason">停止理由</label><textarea class="field" id="stop-reason"></textarea><div class="dialog-actions"><button class="btn" id="stop-preview">演示停止请求回执</button></div><div id="stop-feedback" role="status"></div><p class="hint">停止申请不等于已停止。这里不执行，不改变合成工作状态。</p>`);return}
 if(b.dataset.toggleSource){const s=source(b.dataset.toggleSource);s.enabled=!s.enabled;revision++;render();return}
 if(b.dataset.importSource){importSource(b.dataset.importSource);return}
 if(b.hasAttribute('data-about')){about();return}
 if(b.dataset.image){openImage(b.dataset.image);return}
 if(b.hasAttribute('data-remove-image')){capture();const [file]=chat.files.splice(Number(b.dataset.removeImage),1);URL.revokeObjectURL(file.url);urls.delete(file.id);render();return}
 if(b.hasAttribute('data-clear-target')){capture();chat.target=null;render();return}
 if(b.hasAttribute('data-clear-origin')){capture();chat.origin=null;render();return}
 if(b.dataset.example){capture();if(chat.text.trim()||chat.files.length||chat.origin){notice('已有草稿未覆盖，请先处理原稿。');return}chat.text=b.dataset.example;render();return}
 if(b.id==='pick-image'){$('#image-input').click();return}
 if(b.id==='send'){sendChat();return}
 if(b.id==='save-model'){saveModel();return}
 if(b.id==='confirm-route'){const selected=$('input[name="route-choice"]:checked');if(selected)deliver(work(selected.value));return}
 if(b.id==='scope-note-toggle'){captureDecisionDraft();const draft=decisionDrafts.scope;if(!['future','history'].includes(draft.choice))return;draft.noteOpen[draft.choice]=!draft.noteOpen[draft.choice];syncScopeControls({focusInput:draft.noteOpen[draft.choice]});return}
 if(b.id==='answer-scope'){captureDecisionDraft();const draft=decisionDrafts.scope,answer=buildScopeAnswer(draft);if(answer.error){$('#decision-feedback').innerHTML=`<p class="local-feedback">${esc(answer.error)}</p>`;const state=scopeViewState(draft);(state.showInput?$('#scope-custom'):$('input[name="scope-answer"]'))?.focus();return}const d=decisions.find(d=>d.id==='scope');if(d.resolved||!managed(work(d.work)))return;d.resolved=true;d.answer=answer;chat.messages.push({role:'你',text:answer.text,work:d.work,files:[]},{role:'超管',text:'本地演示：已保留你的原文并关联原事项；若改变范围需重新审阅。没有真实投递或批准操作。',work:d.work,files:[]});decisionDrafts.scope=newScopeDraft();render();return}
 if(b.id==='approval-preview'){const reason=$('#approval-reason').value.trim();$('#decision-feedback').innerHTML=`<p class="local-feedback">${reason?'这里只展示回执位置，没有批准任何操作；待决策保持未处理。':'请先填写决定理由。'}</p>`;return}
 if(b.id==='stop-preview'){const reason=$('#stop-reason').value.trim();$('#stop-feedback').innerHTML=`<p class="local-feedback">${reason?'应先显示请求已受理，权威状态确认后才能写已停止。这里只演示，没有发出请求。':'请填写停止理由。'}</p>`;return}
 if(b.id==='simulate-new'){if(project('new'))return;projects.push({id:'new',name:'新项目（模拟）',short:'NP',purpose:'发现即纳入，没有启动工作',color:'',excluded:false});works.push({id:'new-work',project:'new',session:'session-new',title:'新会话（模拟）',state:'waiting',stage:'尚未启动',summary:'新发现会话已纳入，未自动开始任务。',next:'按需承接明确要求。',goal:'暂无明确工作目标',decision:null,source:'human',excluded:false,active:false,time:'刚刚',events:[]});revision++;render();return}
 if(b.id==='save-source'){captureSourceDraft();if(!sourceDraft.name.trim()||!sourceDraft.location.trim()){$('#source-feedback').textContent='请填写名称与位置。';return}if(sourceDraft.kind.includes('待验证')){$('#source-feedback').textContent='适配能力待验证，不把未验证格式假装保存为可用来源。';return}const id='source-'+(sources.length+1);sources.push({id,kind:sourceDraft.kind,name:sourceDraft.name,project:sourceDraft.project,location:sourceDraft.location,rule:sourceDraft.rule.trim()||'提取未完成条目，先预览再承接',enabled:true});sourceDraft=null;current=null;location.hash='sources/'+id;return}
});
document.addEventListener('input',event=>{if(event.target.id==='draft')chat.text=event.target.value;if(event.target.id==='scope-custom'){captureDecisionDraft();$('#answer-scope').disabled=!scopeViewState(decisionDrafts.scope).canSubmit}});
document.addEventListener('change',event=>{if(event.target.id==='image-input')addImages(event.target.files);if(event.target.name==='scope-answer')chooseScope(event.target.value)});
document.addEventListener('keydown',event=>{if(event.target.id==='draft'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendChat()}if(event.key==='Escape')closeMenu()});
document.addEventListener('paste',event=>{if(event.target.id!=='draft')return;const images=[...event.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(!images.length)return;event.preventDefault();const text=event.clipboardData.getData('text/plain');if(text)event.target.setRangeText(text,event.target.selectionStart,event.target.selectionEnd,'end');chat.text=event.target.value;addImages(images)});
document.addEventListener('dragover',event=>{const zone=event.target.closest('#drop-zone');if(zone){event.preventDefault();zone.classList.add('drop-active')}});document.addEventListener('dragleave',event=>event.target.closest('#drop-zone')?.classList.remove('drop-active'));document.addEventListener('drop',event=>{const zone=event.target.closest('#drop-zone');if(zone){event.preventDefault();zone.classList.remove('drop-active');addImages(event.dataTransfer.files)}});
$('#menu-toggle').addEventListener('click',()=>{const on=$('#sidebar').classList.toggle('open');$('#nav-backdrop').classList.toggle('open',on);$('#menu-toggle').setAttribute('aria-expanded',String(on))});$('#nav-backdrop').addEventListener('click',closeMenu);$('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});window.addEventListener('hashchange',()=>{capture();render()});window.addEventListener('pagehide',()=>{for(const f of urls.values())URL.revokeObjectURL(f.url)});render();
</script>
</body>
</html>
