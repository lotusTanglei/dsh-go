        routerAgentOptions: { provider: deepseek-official, model: deepseek-flash, maxTokens: 64 }
        workerAgentOptions: { provider: deepseek-official, model: deepseek-flash, maxTokens: 64 }
        outputSchema: { type: object, properties: {}, required: [], additionalProperties: false }
