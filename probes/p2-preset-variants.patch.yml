    - id: p2-variant-b
      name: '@deepseek-ai/dsh-agent-preset'
      config: { id: p2-fs-only, plugins: [{ id: fs-local, name: '@deepseek-ai/dsh-fs-local' }, { id: fs, name: '@deepseek-ai/dsh-tool-fs', config: { read: true, readImage: false, write: false, edit: false, applyPatch: false } }] }
