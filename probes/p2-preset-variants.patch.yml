      name: dsh-superagent/p2-real-run
      config:
        routerPreset: p2-role-only
        workerPreset: p2-role-only
        cwd: /Users/dundundebaba/sync/dsh-s-p
        workRoot: /Users/dundundebaba/sync/dsh-s-p/.superagent-state/work/p2-variant
        resultPath: /Users/dundundebaba/sync/dsh-s-p/probes/p2-variant-result.json
