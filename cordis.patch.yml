# P2 role composition: preset declarations plus the host store/guard adapter.
- insert:
    - id: superagent-preset-router
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-router
        name: Go Router
        description: Read-only task routing and human-facing coordination.
        plugins:
          - id: router-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: false, write: false, edit: false, applyPatch: false }
          - id: router-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: router-business
            name: dsh-go/router
    - id: superagent-preset-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-worker
        name: Go Worker
        description: Ticket-scoped execution and structured reporting.
        plugins:
          - id: worker-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: false, write: true, edit: true, applyPatch: false }
          - id: worker-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          # Host bash/jobs are intentionally absent: the Worker shell is the Go-owned
          # `go_bash` tool registered by dsh-go/worker under the L2 process-tree boundary.
          - id: worker-business
            name: dsh-go/worker
    - id: superagent-preset-watchdog
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-watchdog
        name: Go Watchdog
        description: Read-only assignment observation seam.
        plugins:
          - id: watchdog-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: false, write: false, edit: false, applyPatch: false }
          - id: watchdog-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: watchdog-business
            name: dsh-go/watchdog
    - id: superagent-foundation
      name: dsh-go
      config:
        stateDir: /Users/dundundebaba/sync/dsh-s-p/.superagent-state
        dbPath: /Users/dundundebaba/sync/dsh-s-p/.superagent-state/superagent.sqlite
        lockPath: /Users/dundundebaba/sync/dsh-s-p/.superagent-state/superagent.sqlite.lock
        workRoot: /Users/dundundebaba/sync/dsh-s-p/.superagent-state/work
        # Explicit opt-in to the L2 boundary. It only opens when the local probe
        # receipt exists, passes every required check, and matches this exact
        # profile template plus the installed sandbox-exec bytes.
        executionBoundary: verified-dir
